services:
  api:
    build: .
    env_file: .env
    ports: ["5000:5000"]
    depends_on: [mongo, redis]
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
volumes: {mongo-data: {}, redis-data: {}}
